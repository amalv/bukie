
name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bun run test

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bukie_catalog_test
          POSTGRES_PASSWORD: bukie_test
          POSTGRES_USER: bukie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bukie_test -d bukie_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Postgres integration tests
        run: >-
          bun run test --
          src/db/catalog/enrichment/catalog-dry-run.pg.test.ts
          src/db/catalog/enrichment/diagnostic-five-promotion.pg.test.ts
          src/db/catalog/enrichment/persistence.pg.test.ts
          src/db/catalog/enrichment/covers/repository.pg.test.ts
          src/db/catalog/enrichment/descriptions/repository.pg.test.ts
          src/db/catalog/work-first-publication.pg.test.ts
          --no-file-parallelism
        env:
          CATALOG_TEST_POSTGRES_URL: postgresql://bukie_test:bukie_test@127.0.0.1:5432/bukie_catalog_test
